name: Deploy Landing Page

on:
  push:
    branches:
      - v2-new-design

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: 22
          script: |
            # 1. Ensure the directory exists
            mkdir -p /home/payguard/landing
            
            # 2. Go to a temp folder and clone the landing page repo
            cd /tmp
            rm -rf temp_landing
            git clone --depth 1 --branch v2-new-design https://github.com/Bright-CG/Payguard-Landing-Page.git temp_landing
            
            # 3. Copy the files to the live folder
            cp -R temp_landing/* /home/payguard/landing/
            
            # 4. Cleanup
            rm -rf temp_landing
            
            # 5. Strict permissions reset
            echo "Applying strict immutable permissions to landing page..."
            find /home/payguard/landing -type d -exec chmod 750 {} \;
            find /home/payguard/landing -type f -exec chmod 640 {} \;
            
            echo "Landing Page updated successfully!"
